# Alternativa a scripts/pg-local.sh para desenvolvimento local.
# NOTA: não executado no ambiente onde foi escrito (sem daemon Docker); validar localmente.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja-dev-only
      POSTGRES_DB: forja_dev
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - forja-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja -d forja_dev"]
      interval: 5s
      retries: 10
volumes:
  forja-pg:
