name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forja
          POSTGRES_PASSWORD: forja-ci-only
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    env:
      TEST_DATABASE_URL: postgres://forja:forja-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Enquanto não existir package-lock.json no repositório, gera-o aqui
      # e publica-o como artefacto para ser revisto e commitado.
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Publicar package-lock.json gerado
        if: hashFiles('package-lock.json') != '' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test 2>&1 | tee "$RUNNER_TEMP/unit.txt"

      - name: Testes de integração (PostgreSQL)
        run: npm run test:integration 2>&1 | tee "$RUNNER_TEMP/integration.txt"

      - name: Instalar Chromium para E2E
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        env:
          E2E_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$E2E_SCREENSHOTS"
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.txt"

      - name: Capturas de ecrã dos E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Auditoria de dependências
        run: npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/audit.txt"

      # Resumo legível pela API (anotações), útil quando os logs completos não estão acessíveis.
      - name: Resumo
        if: always()
        run: |
          for f in unit integration e2e; do
            [ -f "$RUNNER_TEMP/$f.txt" ] || continue
            line=$(grep -E '^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/$f.txt" | tr '\n' ' ' || true)
            echo "::notice title=$f::$line"
            { grep -E '^not ok' "$RUNNER_TEMP/$f.txt" || true; } | head -5 | while read -r l; do echo "::error title=$f::$l"; done
          done
          if [ -f "$RUNNER_TEMP/integration.txt" ]; then
            { grep -E 'isolamento verificado' "$RUNNER_TEMP/integration.txt" || true; } | head -3 | while read -r l; do echo "::notice title=isolamento::$l"; done
            { grep -E '# SKIP' "$RUNNER_TEMP/integration.txt" || true; } | head -6 | while read -r l; do echo "::notice title=saltado::$l"; done
          fi
          if [ -f "$RUNNER_TEMP/audit.txt" ]; then echo "::notice title=audit::$(grep -E 'vulnerabilit|Severity|^[a-z@][^ ]*  ' "$RUNNER_TEMP/audit.txt" | head -12 | tr '\n' ' ' || true)"; fi
